<!--
  FTL sector profile — shared shell.

  Layout, colour and type for every sector page. Holds no sector-specific content:
  build-sector.py replaces the <title> line and the SECTOR-CONTENT marker below.
  Editing this file changes all 19 pages, which is the point — see tools/SECTOR-PAGE.md §8.
-->
<title>EDIT — sector name</title>
<style>
  /* TOKENS-START — sliced verbatim into sectors/index.html by build-sector-index.py,
     so the chooser and the profiles cannot drift apart in colour. Keep the four
     blocks (bare :root, the media query, and both data-theme overrides) together. */
  :root {
    --void:   #070B10;
    --panel:  #101822;
    --sunk:   #0B1219;
    --edge:   #1F2E3C;
    --ink:    #D6E2EC;
    --dim:    #7C8FA3;
    --faint:  #55697C;
    --cyan:   #5FD3E8;
    --green:  #78C46B;
    --amber:  #E8B84B;
    --red:    #E0685C;
    --rail:   #22384A;
    --hex:    rgba(95,211,232,.035);
    --barlo:  rgba(95,211,232,.22);
    --barred: rgba(224,104,92,.28);

    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --void: #EEF1F4; --panel: #FFFFFF; --sunk: #F5F7F9; --edge: #D3DBE2;
      --ink: #14202B; --dim: #5B6C7B; --faint: #7A8895; --cyan: #12708A;
      --green: #3B7A31; --amber: #8A6606; --red: #AF3B2E; --rail: #C2CDD6;
      --hex: rgba(18,112,138,.045); --barlo: rgba(18,112,138,.18);
      --barred: rgba(175,59,46,.22);
    }
  }
  :root[data-theme="dark"] {
    --void: #070B10; --panel: #101822; --sunk: #0B1219; --edge: #1F2E3C;
    --ink: #D6E2EC; --dim: #7C8FA3; --faint: #55697C; --cyan: #5FD3E8;
    --green: #78C46B; --amber: #E8B84B; --red: #E0685C; --rail: #22384A;
    --hex: rgba(95,211,232,.035); --barlo: rgba(95,211,232,.22);
    --barred: rgba(224,104,92,.28);
  }
  :root[data-theme="light"] {
    --void: #EEF1F4; --panel: #FFFFFF; --sunk: #F5F7F9; --edge: #D3DBE2;
    --ink: #14202B; --dim: #5B6C7B; --faint: #7A8895; --cyan: #12708A;
    --green: #3B7A31; --amber: #8A6606; --red: #AF3B2E; --rail: #C2CDD6;
    --hex: rgba(18,112,138,.045); --barlo: rgba(18,112,138,.18);
    --barred: rgba(175,59,46,.22);
  }

  /* TOKENS-END */

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.6rem 1.15rem 4.5rem;
    background: var(--void);
    background-image: radial-gradient(var(--hex) 1px, transparent 1.6px);
    background-size: 22px 22px;
    color: var(--ink); font-family: var(--sans); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 58rem; margin: 0 auto; display: flex; flex-direction: column; gap: 2.1rem; }

  .eyebrow {
    font-family: var(--mono); font-size: .66rem; letter-spacing: .19em;
    text-transform: uppercase; color: var(--cyan); margin: 0 0 .55rem;
  }
  h1 { font-size: 2.05rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 .7rem; text-wrap: balance; }
  .lede { margin: 0 0 1rem; max-width: 42rem; color: var(--dim); font-size: .95rem; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .facts { display: flex; flex-wrap: wrap; gap: .4rem; }
  .fact {
    font-family: var(--mono); font-size: .68rem; letter-spacing: .06em;
    color: var(--dim); border: 1px solid var(--edge); border-radius: 2px;
    padding: .22rem .5rem; background: var(--panel);
  }
  .fact b { color: var(--ink); font-weight: 600; }

  section { display: flex; flex-direction: column; gap: .8rem; }
  h2 {
    font-size: .74rem; font-family: var(--mono); font-weight: 600;
    letter-spacing: .17em; text-transform: uppercase; color: var(--cyan);
    margin: 0; padding-bottom: .45rem; border-bottom: 1px solid var(--edge);
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  h2 .meta { color: var(--faint); font-weight: 400; letter-spacing: .08em; text-transform: none; flex: none; }
  .note { margin: 0; font-size: .84rem; color: var(--dim); max-width: 44rem; }

  .budget { display: flex; flex-direction: column; gap: .3rem; }
  .brow {
    display: grid; grid-template-columns: 1.4rem 17rem 3.4rem 1fr .9rem; align-items: center;
    gap: .7rem; padding: .34rem .55rem; border-radius: 2px; background: var(--panel);
    border: 1px solid var(--edge);
  }
  /* A budget line opens onto the events it can place. <details> does the work, so the
     page still behaves with scripting off — and inside an artifact's sandbox. */
  .bwrap { border-radius: 2px; }
  .brow.expandable { cursor: pointer; list-style: none; }
  .brow.expandable::-webkit-details-marker { display: none; }
  .brow.expandable::after {
    content: "\203A"; justify-self: end; color: var(--faint); font-family: var(--mono);
    font-size: .9rem; line-height: 1; transition: transform .12s ease, color .12s ease;
  }
  .brow.expandable:hover { border-color: var(--rail); background: var(--sunk); }
  .brow.expandable:hover::after { color: var(--cyan); }
  .bwrap[open] > .brow { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .bwrap[open] > .brow::after { transform: rotate(90deg); color: var(--cyan); }
  .bpool {
    border: 1px solid var(--edge); border-top: 0; border-radius: 0 0 2px 2px;
    background: var(--sunk); padding: .5rem .55rem .6rem 2.1rem;
  }
  .brow .rank {
    font-family: var(--mono); font-size: .66rem; color: var(--faint);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .brow .name {
    font-family: var(--mono); font-size: .74rem; color: var(--ink); overflow-wrap: anywhere;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem;
  }
  .brow.risk { border-left: 2px solid var(--amber); }
  .mark {
    font-family: var(--sans); font-size: .58rem; letter-spacing: .09em; text-transform: uppercase;
    padding: .06rem .3rem; border-radius: 2px; border: 1px solid currentColor;
  }
  .mark.first { color: var(--cyan); }
  .mark.risk { color: var(--amber); }
  .mark.short { color: var(--red); }
  .brow.short { border-left: 2px solid var(--red); }
  .brow .cnt {
    font-family: var(--mono); font-size: .74rem; color: var(--dim);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .track { display: flex; align-items: center; gap: 2px; height: .62rem; flex-wrap: wrap; }
  .blk { width: .62rem; height: .62rem; background: var(--cyan); border-radius: 1px; flex: none; }
  .blk.maybe { background: var(--barlo); }
  .brow.hostile .blk { background: var(--red); }
  .brow.hostile .blk.maybe { background: var(--barred); }
  .brow.zero .cnt { color: var(--faint); }
  /* The fill-in line is not in the file — dashed, so it reads as the gap the table
     leaves rather than another row of it. */
  .brow.fill { border-left: 2px dashed var(--rail); background: transparent; }
  .brow.fill .rank, .brow.fill .name { color: var(--dim); }
  .mark.fill { color: var(--faint); }

  /* What a block means, once, under the table. A faded block is "at least this many",
     which is not something the shape can say on its own. */
  .legend {
    display: flex; flex-direction: column; gap: .4rem;
    border: 1px solid var(--edge); border-radius: 2px; background: var(--sunk);
    padding: .6rem .75rem;
  }
  .lgrow {
    display: grid; grid-template-columns: 3rem 1fr; gap: .7rem; align-items: baseline;
    font-size: .82rem; color: var(--dim);
  }
  .lgrow .lgkey { display: flex; gap: 2px; padding-top: .3rem; }
  .lgrow strong { color: var(--ink); font-weight: 600; }
  /* The budget paints red per row; the legend needs both colours side by side. */
  .blk.hostile { background: var(--red); }
  .blk.maybe.hostile { background: var(--barred); }

  .pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: .4rem; align-items: start; }
  .ev, .evbox {
    background: var(--panel); border: 1px solid var(--edge); border-left: 2px solid var(--rail);
    border-radius: 2px;
  }
  .ev { padding: .48rem .6rem; display: flex; flex-direction: column; gap: .22rem; }
  /* A beacon box opens onto its card, rendered in place by tools/sector-cards.js. */
  .evbox { position: relative; }
  .evbox > summary.ev {
    list-style: none; cursor: pointer; padding-right: 1.6rem;
    transition: background .12s ease;
  }
  .evbox > summary.ev::-webkit-details-marker { display: none; }
  .evbox:hover { border-top-color: var(--cyan); border-right-color: var(--cyan); border-bottom-color: var(--cyan); }
  .evbox:hover > summary.ev { background: var(--sunk); }
  .evbox:hover .t { color: var(--cyan); }
  .evbox > summary.ev:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  /* An open card is a page-width thing, not a grid cell's worth. */
  .evbox[open] {
    grid-column: 1 / -1;
    border-top-color: var(--cyan); border-right-color: var(--cyan); border-bottom-color: var(--cyan);
  }
  .evbox[open] > summary.ev { background: var(--sunk); border-bottom: 1px solid var(--edge); }
  .cardpanel { display: block; padding: .85rem .9rem 1rem; font-size: .84rem; color: var(--dim); }
  .cardlink {
    position: absolute; top: .3rem; right: .35rem; z-index: 1;
    color: var(--faint); text-decoration: none; font-size: .8rem; line-height: 1;
    padding: .15rem .2rem; border-radius: 2px;
  }
  .cardlink:hover, .cardlink:focus-visible { color: var(--cyan); }
  .ev.fight, .evbox.fight { border-left-color: var(--red); }
  .ev.may, .evbox.may { border-left-color: var(--barred); }
  .ev.good, .evbox.good { border-left-color: var(--green); }
  .ev.risk, .evbox.risk { border-left-color: var(--amber); }
  .ev .t { font-size: .84rem; font-weight: 500; line-height: 1.25; }
  .ev .id { font-family: var(--mono); font-size: .63rem; color: var(--faint); letter-spacing: .03em; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .1rem; }
  .tg {
    font-family: var(--mono); font-size: .57rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .08rem .3rem; border-radius: 2px; border: 1px solid currentColor; color: var(--faint);
  }
  .tg.fight, .tg.may-fight { color: var(--red); }
  .tg.crew, .tg.reward { color: var(--green); }
  .tg.crew-loss, .tg.boarders, .tg.cost { color: var(--amber); }
  .tg.quest, .tg.store { color: var(--cyan); }
  /* The two marker tags — what the map draws on the beacon before you jump to it.
     `store-marker` is not `store`: `store` means a store opens somewhere in the tree,
     which is the narrower set. */
  .tg.store-marker { color: var(--cyan); }
  .tg.distress { color: var(--amber); }

  .delta {
    border: 1px dashed var(--edge); border-radius: 2px; background: var(--sunk);
    padding: .6rem .75rem; display: flex; flex-direction: column; gap: .5rem;
  }
  .delta .head {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--amber);
  }
  /* A budget line's expansion carries its pool, then its note, then the AE twin. */
  .bpool .delta, .bpool .note { margin-top: .5rem; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .9rem; align-items: start; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    padding: .9rem 1rem 1rem; display: flex; flex-direction: column; gap: .55rem;
  }
  .panel h3 {
    margin: 0; font-family: var(--mono); font-size: .66rem; letter-spacing: .15em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .45rem; }
  .panel li { font-size: .82rem; line-height: 1.42; display: flex; gap: .5rem; align-items: baseline; }
  .lead {
    font-family: var(--mono); font-size: .72rem; color: var(--cyan); flex: none;
    min-width: 4.6rem; font-variant-numeric: tabular-nums;
  }

  /* The two generated blocks above the budget: every blue option the pool gates,
     and the crew a store here can sell. */
  .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: .9rem; align-items: start; }
  .panel h3 .cnt {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .08em;
    text-transform: none; color: var(--faint); font-weight: 400;
  }
  .gp h3 { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; }

  .gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .1rem .9rem; }
  .grow {
    display: grid; grid-template-columns: 1fr auto auto; gap: .4rem; align-items: baseline;
    font-size: .8rem; padding: .12rem 0; border-bottom: 1px solid var(--sunk);
  }
  /* Blue options read in the card's blue, the colour they carry in game. The level is
     part of the name, so there is no separate chip to colour. */
  .grow .g { overflow-wrap: anywhere; color: hsl(204, 100%, 50%); }
  .grow .h {
    font-family: var(--mono); font-size: .78rem; color: var(--cyan);
    font-variant-numeric: tabular-nums; min-width: 1.2rem; text-align: right;
  }

  /* The whole blue-options box is the toggle: a summary-only control can be opened
     from the rows above it but never closed from the rows it reveals. */
  .gtoggle { cursor: pointer; }
  .gtoggle > summary { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
  .gtoggle > summary::-webkit-details-marker { display: none; }
  .gtoggle:hover { border-color: var(--rail); }
  .gtoggle:hover .morehint { color: var(--cyan); }
  .morehint {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint);
  }
  .morehint::after { content: " \203A"; }
  .gtoggle[open] .morehint::after { content: " \2039"; }
  .gtoggle[open] .morehint { visibility: hidden; height: 0; }
  .gates.rest { padding-top: .3rem; border-top: 1px solid var(--sunk); }

  /* The crew list folded down the middle: two columns, each with its own sub-header so
     the labels sit over their own numbers, and the title riding in the first one's
     empty label cell so the heading costs no line. */
  .crow {
    display: grid; grid-template-columns: 1fr 2.9rem 2.9rem;
    gap: .3rem; align-items: center; font-size: .8rem;
  }
  .crow .cl { overflow-wrap: anywhere; }
  .crow .cp, .crow .cs {
    font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right;
  }
  .crow .cp { font-size: .74rem; color: var(--cyan); }
  .crow .cs { font-size: .68rem; color: var(--dim); }
  .crow.chead {
    font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); padding-bottom: .1rem;
    border-bottom: 1px solid var(--edge); margin-bottom: .12rem;
  }
  .crow.chead .cp, .crow.chead .cs { font-size: .56rem; color: var(--faint); }
  .crow.chead .cl h3 {
    margin: 0; font-family: var(--mono); font-size: .66rem; letter-spacing: .15em;
    text-transform: uppercase; color: var(--dim); font-weight: 600; white-space: nowrap;
  }
  /* A species a store here cannot offer, kept in the table at 0%: rarity 0 is a flag
     meaning "not in the pool", and the zero row says so where a player is looking. */
  .crow.out .cl, .crow.out .cp, .crow.out .cs { color: var(--faint); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .18rem 1.1rem; }
  .tcol { display: flex; flex-direction: column; gap: .18rem; }
  .crewpanel { justify-content: flex-start; }
  @media (max-width: 40rem) { .two { grid-template-columns: 1fr; } }

  .chain { display: flex; flex-direction: column; gap: 0; }
  .step { display: grid; grid-template-columns: 1.6rem 1fr; gap: .7rem; }
  .marker { display: flex; flex-direction: column; align-items: center; }
  .dot {
    width: 1.35rem; height: 1.35rem; border-radius: 50%; flex: none;
    border: 1px solid var(--cyan); color: var(--cyan); background: var(--panel);
    font-family: var(--mono); font-size: .68rem; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .step .line { width: 1px; flex: 1; background: var(--rail); min-height: .6rem; }
  .step .body { padding-bottom: .95rem; }
  .step .body .t { font-size: .88rem; font-weight: 500; }
  .step .body .d { font-size: .81rem; color: var(--dim); margin-top: .15rem; }
  .step .body .id { font-family: var(--mono); font-size: .63rem; color: var(--faint); margin-top: .12rem; }
  .step.end .dot { border-color: var(--green); color: var(--green); }

  .ref { color: var(--ink); font-weight: 500; }
  code { font-family: var(--mono); font-size: .92em; color: var(--ink); }
  @media (max-width: 40rem) {
    .brow { grid-template-columns: 1.4rem 1fr 3.4rem .9rem; }
    .brow .track { grid-column: 1 / -1; grid-row: 2; }
    .brow.expandable::after { grid-column: 4; grid-row: 1; }
    .bpool { padding-left: .55rem; }
  }
</style>

<div class="wrap">
<!--SECTOR-CONTENT-->
</div>
