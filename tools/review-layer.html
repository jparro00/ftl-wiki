
<!-- ============================================================================
     REVIEW LAYER — added to this copy only, never to the shared shell.
     Select any text on the page to attach a note. Notes persist in localStorage
     and export as markdown for Claude. Nothing here touches the page's own data.
     ============================================================================ -->
<style id="cmt-style">
  mark.cmt-hl {
    background: rgba(232,184,75,.28);
    color: inherit;
    border-bottom: 1px solid rgba(232,184,75,.75);
    border-radius: 2px;
    padding: 0 1px;
    cursor: pointer;
  }
  mark.cmt-hl[data-active="1"] { background: rgba(232,184,75,.55); }

  #cmt-fab {
    position: fixed; z-index: 9998;
    display: none;
    padding: 6px 12px;
    font: 600 12px/1 var(--sans, system-ui);
    letter-spacing: .04em; text-transform: uppercase;
    color: #0B1219; background: var(--amber, #E8B84B);
    border: 0; border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    cursor: pointer;
  }

  #cmt-composer {
    position: fixed; z-index: 9999; display: none;
    width: 320px; padding: 10px;
    background: var(--panel, #101822);
    border: 1px solid var(--edge, #1F2E3C); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #cmt-composer .q {
    font: 400 11px/1.45 var(--mono, monospace);
    color: var(--dim, #7C8FA3);
    max-height: 54px; overflow: hidden;
    border-left: 2px solid var(--amber, #E8B84B);
    padding-left: 7px; margin-bottom: 8px;
  }
  #cmt-composer textarea {
    width: 100%; box-sizing: border-box; height: 84px; resize: vertical;
    background: var(--sunk, #0B1219); color: var(--ink, #D6E2EC);
    border: 1px solid var(--edge, #1F2E3C); border-radius: 4px;
    padding: 7px; font: 400 13px/1.45 var(--sans, system-ui);
  }
  #cmt-composer .row { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }

  .cmt-btn {
    font: 600 11px/1 var(--sans, system-ui); letter-spacing: .04em;
    padding: 7px 11px; border-radius: 4px; cursor: pointer;
    background: var(--sunk, #0B1219); color: var(--ink, #D6E2EC);
    border: 1px solid var(--edge, #1F2E3C);
  }
  .cmt-btn.primary { background: var(--amber, #E8B84B); color: #0B1219; border-color: transparent; }
  .cmt-btn:hover { border-color: var(--amber, #E8B84B); }

  #cmt-tab {
    position: fixed; right: 0; top: 92px; z-index: 9997;
    writing-mode: vertical-rl;
    padding: 12px 7px;
    font: 600 11px/1 var(--sans, system-ui); letter-spacing: .12em; text-transform: uppercase;
    color: #0B1219; background: var(--amber, #E8B84B);
    border: 0; border-radius: 5px 0 0 5px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  #cmt-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 9997;
    width: 340px; transform: translateX(100%);
    transition: transform .18s ease;
    display: flex; flex-direction: column;
    background: var(--panel, #101822);
    border-left: 1px solid var(--edge, #1F2E3C);
    box-shadow: -12px 0 34px rgba(0,0,0,.45);
  }
  #cmt-panel[data-open="1"] { transform: none; }
  #cmt-panel header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 10px; border-bottom: 1px solid var(--edge, #1F2E3C);
  }
  #cmt-panel header h2 {
    margin: 0; flex: 1;
    font: 700 12px/1 var(--sans, system-ui); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink, #D6E2EC);
  }
  #cmt-list { flex: 1; overflow-y: auto; padding: 10px; }
  #cmt-list .empty {
    font: 400 12px/1.6 var(--sans, system-ui); color: var(--faint, #55697C); padding: 8px 4px;
  }
  .cmt-item {
    border: 1px solid var(--edge, #1F2E3C); border-radius: 5px;
    background: var(--sunk, #0B1219);
    padding: 9px; margin-bottom: 9px; cursor: pointer;
  }
  .cmt-item:hover { border-color: var(--amber, #E8B84B); }
  .cmt-item .q {
    font: 400 11px/1.45 var(--mono, monospace); color: var(--dim, #7C8FA3);
    border-left: 2px solid var(--amber, #E8B84B); padding-left: 7px; margin-bottom: 6px;
  }
  .cmt-item .n {
    font: 400 13px/1.5 var(--sans, system-ui); color: var(--ink, #D6E2EC);
    white-space: pre-wrap;
  }
  .cmt-item .tools { display: flex; gap: 10px; margin-top: 7px; }
  .cmt-item .tools button {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: 600 10px/1 var(--sans, system-ui); letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint, #55697C);
  }
  .cmt-item .tools button:hover { color: var(--red, #E0685C); }
  .cmt-item .tools button.edit:hover { color: var(--cyan, #5FD3E8); }
  #cmt-foot {
    padding: 10px; border-top: 1px solid var(--edge, #1F2E3C);
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  #cmt-toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 10000; display: none;
    padding: 9px 16px; border-radius: 5px;
    background: var(--amber, #E8B84B); color: #0B1219;
    font: 600 12px/1 var(--sans, system-ui);
  }
  @media print { #cmt-tab, #cmt-panel, #cmt-fab, #cmt-composer, #cmt-toast { display: none !important; } }
</style>

<div id="cmt-ui">
  <button id="cmt-tab" type="button">Comments <span id="cmt-count">0</span></button>
  <button id="cmt-fab" type="button">Comment</button>

  <div id="cmt-composer">
    <div class="q"></div>
    <textarea placeholder="What should change here?"></textarea>
    <div class="row">
      <button class="cmt-btn" data-act="cancel" type="button">Cancel</button>
      <button class="cmt-btn primary" data-act="save" type="button">Save</button>
    </div>
  </div>

  <aside id="cmt-panel">
    <header>
      <h2>Review notes</h2>
      <button class="cmt-btn" data-act="close" type="button">Close</button>
    </header>
    <div id="cmt-list"></div>
    <div id="cmt-foot">
      <button class="cmt-btn primary" data-act="copy" type="button">Copy for Claude</button>
      <button class="cmt-btn" data-act="download" type="button">Download .md</button>
      <button class="cmt-btn" data-act="clear" type="button">Clear all</button>
    </div>
  </aside>

  <div id="cmt-toast"></div>
</div>

<script id="cmt-script">
(() => {
  "use strict";

  const KEY = "ftl-review:" + (location.pathname.split("/").pop() || "page");
  const ui = document.getElementById("cmt-ui");
  const fab = document.getElementById("cmt-fab");
  const composer = document.getElementById("cmt-composer");
  const panel = document.getElementById("cmt-panel");
  const list = document.getElementById("cmt-list");
  const count = document.getElementById("cmt-count");
  const toastEl = document.getElementById("cmt-toast");

  let notes = [];
  let pending = null;   /* {start, end, quote} awaiting a note */
  let editing = null;   /* id being re-edited */

  /* ---- storage ---------------------------------------------------------- */

  const load = () => {
    try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch (err) { notes = []; }
  };
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(notes)); }
    catch (err) { toast("Could not save — storage blocked"); }
  };

  /* ---- text-offset anchoring -------------------------------------------
     Every anchor is a [start,end) pair of character offsets into the page's
     visible text, so highlights survive a reload without depending on DOM
     paths. Wrapping a range in <mark> splits text nodes but never changes the
     text itself, so offsets recorded earlier stay valid.                    */

  const walker = () => document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (ui.contains(parent)) return NodeFilter.FILTER_REJECT;
      const tag = parent.tagName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TITLE") return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  /* A range boundary is not always inside a text node: triple-click, select-all and
     any drag that crosses an element edge hand back (element, childIndex) instead.
     Both forms resolve to the same scale — characters of visible text from the top. */
  const offsetOf = (node, offset) => {
    if (node.nodeType === Node.TEXT_NODE) {
      const w = walker();
      let total = 0, cur;
      while ((cur = w.nextNode())) {
        if (cur === node) return total + offset;
        total += cur.nodeValue.length;
      }
      return -1;
    }

    /* Element boundary: the offset counts child nodes. Walk the text and take the
       position where the child at that index begins — or where the element ends, when
       the boundary sits past its last child. */
    const kids = node.childNodes;
    const edge = offset >= kids.length ? null : kids[offset];
    const w = walker();
    let total = 0, cur, endOfNode = -1;
    while ((cur = w.nextNode())) {
      if (edge && (cur === edge || edge.contains(cur))) return total;
      total += cur.nodeValue.length;
      if (node.contains(cur)) endOfNode = total;
    }
    /* No text after the boundary inside this element: its own end, or the document's. */
    return edge ? (endOfNode >= 0 ? endOfNode : -1) : (endOfNode >= 0 ? endOfNode : -1);
  };

  /* All text-node slices covered by [start,end), in document order. */
  const slices = (start, end) => {
    const out = [];
    const w = walker();
    let total = 0, cur;
    while ((cur = w.nextNode())) {
      const len = cur.nodeValue.length;
      const nodeStart = total, nodeEnd = total + len;
      total = nodeEnd;
      if (nodeEnd <= start) continue;
      if (nodeStart >= end) break;
      out.push({
        node: cur,
        from: Math.max(0, start - nodeStart),
        to: Math.min(len, end - nodeStart)
      });
    }
    return out;
  };

  const paint = note => {
    let painted = 0;
    for (const s of slices(note.start, note.end)) {
      if (s.to <= s.from) continue;
      const r = document.createRange();
      r.setStart(s.node, s.from);
      r.setEnd(s.node, s.to);
      const mark = document.createElement("mark");
      mark.className = "cmt-hl";
      mark.dataset.cid = note.id;
      try { r.surroundContents(mark); painted++; }
      catch (err) { /* a slice that straddles an element edge — skip it */ }
    }
    return painted > 0;
  };

  const unpaint = id => {
    document.querySelectorAll('mark.cmt-hl[data-cid="' + id + '"]').forEach(mark => {
      const parent = mark.parentNode;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      parent.normalize();
    });
  };

  /* ---- ui --------------------------------------------------------------- */

  let toastTimer = 0;
  const toast = msg => {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 1900);
  };

  const hideFab = () => { fab.style.display = "none"; };

  const place = (el, rect) => {
    el.style.display = "block";
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = rect.left + rect.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    let top = rect.top - h - 8;
    if (top < 8) top = rect.bottom + 8;
    top = Math.min(top, window.innerHeight - h - 8);
    el.style.left = left + "px";
    el.style.top = top + "px";
  };

  const closeComposer = () => {
    composer.style.display = "none";
    composer.querySelector("textarea").value = "";
    pending = null;
    editing = null;
  };

  const openComposer = (rect, quote, existing) => {
    composer.querySelector(".q").textContent = quote;
    const ta = composer.querySelector("textarea");
    ta.value = existing || "";
    place(composer, rect);
    ta.focus();
  };

  const render = () => {
    count.textContent = String(notes.length);
    list.innerHTML = "";
    if (!notes.length) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "No notes yet. Select any text on the page and click Comment.";
      list.appendChild(p);
      return;
    }
    notes.slice().sort((a, b) => a.start - b.start).forEach((note, i) => {
      const item = document.createElement("div");
      item.className = "cmt-item";
      item.dataset.cid = note.id;

      const q = document.createElement("div");
      q.className = "q";
      q.textContent = (i + 1) + ". " + note.quote;

      const n = document.createElement("div");
      n.className = "n";
      n.textContent = note.text;

      const tools = document.createElement("div");
      tools.className = "tools";
      const edit = document.createElement("button");
      edit.className = "edit"; edit.type = "button"; edit.dataset.act = "edit";
      edit.textContent = "Edit";
      const del = document.createElement("button");
      del.type = "button"; del.dataset.act = "delete";
      del.textContent = "Delete";
      tools.append(edit, del);

      item.append(q, n, tools);
      list.appendChild(item);
    });
  };

  const focusNote = id => {
    document.querySelectorAll("mark.cmt-hl[data-active]").forEach(m => m.removeAttribute("data-active"));
    const marks = document.querySelectorAll('mark.cmt-hl[data-cid="' + id + '"]');
    marks.forEach(m => m.setAttribute("data-active", "1"));
    if (marks.length) marks[0].scrollIntoView({ behavior: "smooth", block: "center" });
  };

  /* ---- export ----------------------------------------------------------- */

  const markdown = () => {
    const title = (document.querySelector("title") || {}).textContent || document.title || "page";
    const lines = ["# Review notes — " + title, "", "File: " + location.pathname, ""];
    notes.slice().sort((a, b) => a.start - b.start).forEach((note, i) => {
      lines.push("## " + (i + 1));
      lines.push("> " + note.quote.replace(/\n+/g, " "));
      lines.push("");
      lines.push(note.text);
      lines.push("");
    });
    return lines.join("\n");
  };

  /* ---- events ----------------------------------------------------------- */

  document.addEventListener("mouseup", event => {
    if (ui.contains(event.target)) return;
    setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) { hideFab(); return; }
      const range = sel.getRangeAt(0);
      const quote = sel.toString().trim();
      if (!quote) { hideFab(); return; }
      const start = offsetOf(range.startContainer, range.startOffset);
      const end = offsetOf(range.endContainer, range.endOffset);
      if (start < 0 || end < 0 || end <= start) { hideFab(); return; }
      pending = { start, end, quote, rect: range.getBoundingClientRect() };
      place(fab, pending.rect);
    }, 0);
  });

  fab.addEventListener("click", () => {
    if (!pending) return;
    hideFab();
    openComposer(pending.rect, pending.quote, "");
  });

  composer.addEventListener("click", event => {
    const act = event.target.dataset && event.target.dataset.act;
    if (act === "cancel") { closeComposer(); return; }
    if (act !== "save") return;

    const text = composer.querySelector("textarea").value.trim();
    if (!text) { toast("Write something first"); return; }

    if (editing) {
      const note = notes.find(n => n.id === editing);
      if (note) note.text = text;
    } else if (pending) {
      const note = {
        id: "c" + notes.length + "-" + pending.start + "-" + pending.end,
        start: pending.start,
        end: pending.end,
        quote: pending.quote,
        text
      };
      notes.push(note);
      paint(note);
      window.getSelection().removeAllRanges();
    }
    save(); render(); closeComposer();
    panel.dataset.open = "1";
  });

  composer.addEventListener("keydown", event => {
    if (event.key === "Escape") closeComposer();
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
      composer.querySelector('[data-act="save"]').click();
    }
  });

  document.addEventListener("click", event => {
    const mark = event.target.closest && event.target.closest("mark.cmt-hl");
    if (mark) {
      panel.dataset.open = "1";
      focusNote(mark.dataset.cid);
      const item = list.querySelector('.cmt-item[data-cid="' + mark.dataset.cid + '"]');
      if (item) item.scrollIntoView({ block: "center" });
      return;
    }
    if (!ui.contains(event.target)) hideFab();
  });

  document.getElementById("cmt-tab").addEventListener("click", () => {
    panel.dataset.open = panel.dataset.open === "1" ? "0" : "1";
  });

  panel.addEventListener("click", event => {
    const btn = event.target.closest("button");
    const item = event.target.closest(".cmt-item");

    if (btn && btn.dataset.act === "close") { panel.dataset.open = "0"; return; }

    if (btn && btn.dataset.act === "copy") {
      navigator.clipboard.writeText(markdown())
        .then(() => toast("Copied — paste it to Claude"))
        .catch(() => toast("Clipboard blocked — use Download"));
      return;
    }

    if (btn && btn.dataset.act === "download") {
      const blob = new Blob([markdown()], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "review-notes.md";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }

    if (btn && btn.dataset.act === "clear") {
      if (!notes.length) return;
      if (!confirm("Delete all " + notes.length + " notes?")) return;
      notes.forEach(n => unpaint(n.id));
      notes = []; save(); render();
      return;
    }

    if (!item) return;
    const id = item.dataset.cid;

    if (btn && btn.dataset.act === "delete") {
      unpaint(id);
      notes = notes.filter(n => n.id !== id);
      save(); render();
      return;
    }

    if (btn && btn.dataset.act === "edit") {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      editing = id; pending = null;
      const mark = document.querySelector('mark.cmt-hl[data-cid="' + id + '"]');
      const rect = mark ? mark.getBoundingClientRect()
                        : { left: window.innerWidth / 2, top: 120, width: 0, height: 0, bottom: 120 };
      openComposer(rect, note.quote, note.text);
      return;
    }

    focusNote(id);
  });

  /* ---- boot -------------------------------------------------------------
     Repaint oldest-first so earlier marks don't shift the offsets of later
     ones — they can't, since wrapping preserves text — and drop any anchor
     the page no longer contains (the page was rebuilt under the note).      */

  load();
  const survivors = [];
  /* A selection spanning elements reads back with line breaks the browser inserted at
     the block boundaries, while the markup itself has no whitespace between those
     elements at all — so the check ignores whitespace entirely rather than collapsing
     it. Same characters at the same offsets is still a strong guard against a page
     that changed underneath the note. */
  const same = s => s.replace(/\s+/g, "");
  notes.slice().sort((a, b) => a.start - b.start).forEach(note => {
    const found = slices(note.start, note.end).map(s => s.node.nodeValue.slice(s.from, s.to)).join("");
    if (same(found) && same(found) === same(note.quote) && paint(note)) survivors.push(note);
    else survivors.push(Object.assign({ orphan: true }, note));
  });
  notes = survivors;
  render();
  if (notes.length) panel.dataset.open = "1";
})();
</script>
